version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - pip install --upgrade pip
  build:
    commands:
      - echo "Building Lambda deployment packages"
      
      # Package index-photos Lambda
      - cd index_photos
      - cp LF1.py lambda_function.py
      - zip -r ../index-photos.zip lambda_function.py
      - rm lambda_function.py
      - cd ..
      
      # Package search-photos Lambda
      - cd search_photos
      - cp LF2.py lambda_function.py
      - zip -r ../search-photos.zip lambda_function.py
      - rm lambda_function.py
      - cd ..
      
  post_build:
    commands:
      - echo "Deploying to Lambda functions"
      - aws lambda update-function-code --function-name LF1 --zip-file fileb://index-photos.zip
      - aws lambda update-function-code --function-name LF2 --zip-file fileb://search-photos.zip
artifacts:
  files:
    - index-photos.zip
    - search-photos.zip